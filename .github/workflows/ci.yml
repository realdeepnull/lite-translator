name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run knip
      - run: npm run test
      - run: npx playwright install chromium --with-deps
      - run: npm run test --workspace @lite-translator/engine-onnx
        env:
          CI: "true"